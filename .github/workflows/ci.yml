name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Set RUSTFLAGS in the steps that build or test, not globally: cargo does not
# rebuild dependencies when RUSTFLAGS changes, so a global setting produces
# stale artifacts and, when a crate fails to compile, breaks the build in
# ways that have nothing to do with the change under test.

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Not --all-features: the bundled-moli feature requires an engine archive
      # that only the release pipeline produces, so enabling it here would fail
      # the build on an input that does not exist in a checkout.
      - run: cargo clippy --locked --all-targets -- -D warnings

  encoding:
    name: Text encoding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject mojibake
        run: python scripts/check-encoding.py

  license:
    name: License and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify license metadata is consistent
        run: python scripts/check-metadata.py

  unit:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked --all-targets -- --test-threads=1
        env:
          # Serialised so environment-sensitive tests cannot race each other.
          RUST_TEST_THREADS: "1"
      - name: Release build
        run: cargo build --release --locked

  browser:
    name: Real browser integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo build --locked
      - run: npx --yes playwright install --with-deps chromium
      - name: Run integration suites
        shell: bash
        env:
          # Loopback-only credential for the CI fixture server. Never reuse.
          DELTA_TOKEN: ci-fixture-only-token-not-for-production
          # Explicit opt-in; mocks stay disabled in normal execution.
          DELTA_ALLOW_NETWORK_MOCKS: "1"
          DELTA_EXPECT_VERSION: "0.0.1"
        run: |
          set -euo pipefail
          export DELTA_UPLOAD_ROOT="$PWD/examples"
          mkdir -p artifacts/v05

          CHROME=$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux*/chrome' -type f | head -1)
          if [ -z "$CHROME" ]; then
            echo "::error::Playwright Chromium was not found; cannot run integration tests."
            exit 1
          fi
          "$CHROME" --headless --no-sandbox --remote-debugging-port=9222 \
            --user-data-dir="$RUNNER_TEMP/delta-chrome" about:blank >chrome.log 2>&1 &
          CHROME_PID=$!
          python3 -m http.server 4173 --bind 127.0.0.1 --directory examples >fixture.log 2>&1 &
          FIXTURE_PID=$!
          target/debug/delta mcp --transport http >delta.log 2>&1 &
          DELTA_PID=$!
          trap 'kill "$CHROME_PID" "$FIXTURE_PID" "$DELTA_PID" 2>/dev/null || true' EXIT

          for url in http://127.0.0.1:9222/json/version \
                     http://127.0.0.1:4173/login.html \
                     http://127.0.0.1:8931/health; do
            curl --retry 30 --retry-connrefused --retry-delay 1 --fail "$url" >/dev/null
          done

          # Every suite that can run on a generic Linux host. Moli, cgroup and
          # Landlock suites are covered by the sandbox job below.
          for suite in e2e_extended transports_profiles_e2e supervisor_e2e features_e2e; do
            echo "::group::tests/${suite}.py"
            python3 "tests/${suite}.py"
            echo "::endgroup::"
          done

          echo "::group::tests/stdio_cancel_e2e.py"
          python3 tests/stdio_cancel_e2e.py
          echo "::endgroup::"
      - name: Verify the shipped skill file is present
        run: |
          test -f docs/AGENT-SKILL.md || { echo "::error::docs/AGENT-SKILL.md is missing; profiles.rs embeds it at compile time."; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/
            *.log
          if-no-files-found: ignore

  sandbox:
    name: Sandbox and resource limits
    # Landlock, seccomp and cgroup v2 require a Linux kernel with the relevant
    # controllers; hosted macOS/Windows runners cannot exercise them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gcc
      - run: cargo build --locked
      - name: Sandbox probe
        run: |
          set -euo pipefail
          target/debug/delta sandbox probe | tee sandbox-probe.json
      - name: Landlock enforcement
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '"supported": true' sandbox-probe.json; then
            echo "::notice::Landlock is unavailable on this kernel; skipping enforcement assertions."
            exit 0
          fi
          python3 tests/sandbox_e2e.py
      - name: cgroup v2 delegation and OOM isolation
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /sys/fs/cgroup/cgroup.controllers ]; then
            echo "::notice::cgroup v2 is unavailable; skipping resource-limit assertions."
            exit 0
          fi
          if ! grep -qw memory /sys/fs/cgroup/cgroup.controllers; then
            echo "::notice::The memory controller is not delegated; skipping OOM assertions."
            exit 0
          fi
          bash scripts/run-delegated.sh
          python3 tests/sandbox_delegation_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-evidence
          path: |
            artifacts/
            sandbox-probe.json
          if-no-files-found: ignore

  docs:
    name: Documentation integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify internal links resolve
        run: python scripts/check-docs.py
      - name: Build the SBOM
        run: python scripts/generate-sbom.py --check
      - name: Verify the tool reference matches the manifest
        run: python scripts/generate-tools-doc.py --check
      - name: Verify the manifest matches the built binary
        run: |
          cargo build --release --locked
          python scripts/generate-tools-manifest.py
          git diff --exit-code docs/tools.json \
            || { echo "::error::docs/tools.json is stale; run scripts/generate-tools-manifest.py"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: docs/SBOM.cdx.json