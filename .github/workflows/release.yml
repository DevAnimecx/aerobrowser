name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match Cargo.toml, e.g. v0.5.0)"
        required: true

# Write access is scoped to the publish job; builders only need to read.
permissions:
  contents: read

jobs:
  verify-version:
    name: Verify tag matches the workspace
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          set -euo pipefail
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$CARGO_VERSION" ]; then
            echo "::error::could not read version from Cargo.toml"; exit 1
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ]; then TAG="${{ inputs.version }}"; fi
          # Publishing v9.9.9 with a 0.5.0 binary would make every checksum wrong.
          if [ "$TAG" != "v${CARGO_VERSION}" ]; then
            echo "::error::tag '$TAG' does not match Cargo.toml version 'v${CARGO_VERSION}'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG"

  build:
    name: Build ${{ matrix.artifact }}
    needs: verify-version
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: aero-linux-x86_64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: aero-linux-aarch64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: aero-macos-aarch64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: aero-macos-x86_64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: aero-windows-x86_64.zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: aero-windows-aarch64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/aero"
          [ -f "$BIN" ] || BIN="target/${{ matrix.target }}/release/aero.exe"
          if [ ! -f "$BIN" ]; then
            echo "::error::no built binary at $BIN"; exit 1
          fi
          ARTIFACT="${{ matrix.artifact }}"
          if [ "${ARTIFACT##*.}" = "zip" ]; then
            # BSL-1.1 redistribution requires the notice to travel with the binary.
            zip -j "dist/$ARTIFACT" "$BIN" LICENSE THIRD-PARTY-NOTICES.md README.md
          else
            cp "$BIN" "dist/$ARTIFACT"
            cp LICENSE "dist/${ARTIFACT}.LICENSE"
          fi

      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "windows-2022" ] || [ "${{ matrix.os }}" = "windows-11-arm" ]; then
            BIN="target/${{ matrix.target }}/release/aero.exe"
          else
            BIN="target/${{ matrix.target }}/release/aero"
            chmod +x "$BIN"
          fi
          "$BIN" --version
          "$BIN" doctor --json > doctor.json
          echo "doctor produced $(wc -c < doctor.json) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  checksums:
    name: Checksums and provenance
    needs: [verify-version, build]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ needs.verify-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: ./dist

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          # Every filename the installers will look up must appear here.
          sha256sum aero-* > SHA256SUMS
          mv SHA256SUMS ../
          cat SHA256SUMS
          # A file listed but absent would make verification silently impossible.
          while read -r _ name; do
            if [ ! -f "dist/$name" ]; then
              echo "::error::SHA256SUMS lists $name but it was not built"
              exit 1
            fi
          done < SHA256SUMS

      - name: Generate the SBOM
        run: python scripts/generate-sbom.py

      - name: Summarize provenance
        id: provenance
        run: |
          set -euo pipefail
          {
            echo "### Build provenance"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Tag | \`${{ needs.verify-version.outputs.tag }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Workflow run | [\`${{ github.run_number }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo "| Rust | \`$(rustc --version)\` |"
            echo ""
            echo "Verify a download:"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS"
            echo '```'
          } > PROVENANCE.md
          cat PROVENANCE.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            SHA256SUMS
            PROVENANCE.md
            docs/SBOM.cdx.json
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [verify-version, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: ./artifacts
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: ./metadata

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify-version.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/aero-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no artifacts to publish"; exit 1
          fi
          printf 'Publishing %s with %d artifact(s)\n' "$TAG" "${#files[@]}"

          {
            cat metadata/PROVENANCE.md
            echo
            echo "### Install"
            echo
            echo '```sh'
            echo "# Linux / macOS"
            echo "curl -fsSL https://raw.githubusercontent.com/DevAnimecx/aerobrowser/master/scripts/install.sh | sh"
            echo '```'
            echo
            echo '```powershell'
            echo "# Windows PowerShell"
            echo "irm https://raw.githubusercontent.com/DevAnimecx/aerobrowser/master/scripts/install.ps1 | iex; Install-AeroBrowser -Agent opencode"
            echo '```'
            echo
            echo "Both installers verify the \`SHA256SUMS\` digest published with this release."
            echo
            echo "### Verify your install"
            echo
            echo '```sh'
            echo "aero doctor"
            echo '```'
            echo
            echo "### Licensing"
            echo
            echo "Business Source License 1.1 with an Additional Use Grant. Free below USD 10M annual"
            echo "revenue; commercial use above that, or offering browser automation as a service,"
            echo "requires a paid license. See [LICENSE](https://github.com/DevAnimecx/aerobrowser/blob/master/LICENSE)."
          } > NOTES.md

          gh release create "$TAG" "${files[@]}" metadata/SHA256SUMS \
            --verify-tag --title "AeroBrowser $TAG" --notes-file NOTES.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: artifacts/aero-*