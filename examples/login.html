<!doctype html><html lang="en"><meta charset="utf-8"><title>Delta Test App</title><style>body{font:18px system-ui;margin:80px auto;max-width:560px;background:#112033;color:#eef6ff}input,button{display:block;padding:14px;margin:15px 0;width:90%;font:inherit}button{background:#75e5c3;border:0;border-radius:8px;cursor:pointer}#result{padding:20px;background:#20364e}label{display:block}</style><h1>DeltaBrowser test fixture</h1><form id="login"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Sign in</button></form><section id="result" hidden></section><script>document.querySelector('form').onsubmit=e=>{e.preventDefault();const r=document.querySelector('#result');r.textContent='Welcome, '+document.querySelector('#email').value;r.hidden=false;history.pushState({},'', '#dashboard');};</script></html>
